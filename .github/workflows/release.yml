name: Build Release Apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v6.2-rc1). Leave blank to only upload build artifacts.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk-17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE="$RUNNER_TEMP/signing/kizzy.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore supplied via repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "store_password=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "key_password=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "signed_with=repository secret keystore" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret found, generating a throwaway keystore"
            GENERATED_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias kizzy \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GENERATED_PASSWORD" \
              -keypass "$GENERATED_PASSWORD" \
              -dname "CN=Kizzy CI, OU=CI, O=Kizzy, L=NA, S=NA, C=NA"
            echo "::add-mask::$GENERATED_PASSWORD"
            echo "store_password=$GENERATED_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=kizzy" >> "$GITHUB_OUTPUT"
            echo "key_password=$GENERATED_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "signed_with=ephemeral CI keystore (NOT an upgrade-compatible signature)" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Release
        env:
          KIZZY_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KIZZY_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          KIZZY_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KIZZY_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect apks
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist
          echo "Built from commit $GITHUB_SHA" > dist/BUILD_INFO.txt
          echo "Signed with: ${{ steps.keystore.outputs.signed_with }}" >> dist/BUILD_INFO.txt

      - name: Upload apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kizzy-apks
          path: dist/**

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Automated build of `${{ github.ref_name }}` at `${{ github.sha }}`.

            Signed with: ${{ steps.keystore.outputs.signed_with }}
          files: dist/**
